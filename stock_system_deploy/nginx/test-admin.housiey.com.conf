# ==============================================================================
# Nginx Reverse Proxy Configuration with OpenSSL / HTTPS for Autonomous Stock System
# Domain: test-admin.housiey.com
# Internal Port: 127.0.0.1:9012
# SSL Port: 443 (HTTPS)
# ==============================================================================

upstream stock_backend_cluster {
    server 127.0.0.1:9012;
    keepalive 32;
}

# 1. HTTP Server (Port 80) - Auto-redirects to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name test-admin.housiey.com;

    # Redirect all plain HTTP traffic to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443) - OpenSSL / TLS Secured
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-admin.housiey.com;

    # SSL Certificates (Generated via OpenSSL / Let's Encrypt)
    ssl_certificate /etc/ssl/certs/stock_system.crt;
    ssl_certificate_key /etc/ssl/private/stock_system.key;

    # Modern SSL Protocols & Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Client body limit
    client_max_body_size 50M;

    # Access and Error Logs
    access_log /var/log/nginx/stock_system_ssl_access.log;
    error_log /var/log/nginx/stock_system_ssl_error.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://stock_backend_cluster;
        proxy_http_version 1.1;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering for live low-latency polling & streaming
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
